name: Compilar APK Reproductor

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Instalar Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de prueba
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Nombrar APK según versión
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "No se encontró versionName en app/build.gradle" >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Reproductor-${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: Reproductor-${{ steps.version.outputs.version }}-APK
          path: app/build/outputs/apk/debug/Reproductor-${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 30
